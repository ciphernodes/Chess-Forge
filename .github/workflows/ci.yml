name: ChessForge CI (TS Strict, Node Tests, Go Native Host & Android Kotlin)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  typescript-and-tests:
    name: TypeScript Strict Check & Node Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript Dev Dependencies
        working-directory: browser-extension
        run: npm install --no-audit --no-fund

      - name: TypeScript Strict Mode Check (tsc --noEmit)
        working-directory: browser-extension
        run: npx tsc -p tsconfig.json --noEmit

      - name: Run All Unit Test Suites (node --test)
        run: node --test browser-extension/src/ts/*.test.ts

  go-native-input-host:
    name: Go Native Input Host (Linux Test + Windows SendInput Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go Vet & Unit Tests
        working-directory: native-host
        run: |
          go vet ./...
          go test -v ./...

      - name: Build Native Host (Linux & Windows amd64)
        working-directory: native-host
        run: |
          go build ./...
          GOOS=windows GOARCH=amd64 go build -o native_input_host.exe .

  android-kotlin-checks:
    name: Android Kotlin Compile & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Extension ZIP into Android Assets
        run: |
          (cd browser-extension && zip -r ../app/src/main/assets/chess-forge-browser-extension.zip manifest.json README.md icons src vendor)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment & Debug Keystore
        run: |
          if [ ! -f ".env" ]; then cp .env.example .env 2>/dev/null || touch .env; fi
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile Kotlin & Run Android Unit Tests
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace --no-daemon --max-workers=2
          else
            gradle :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace --no-daemon --max-workers=2
          fi
